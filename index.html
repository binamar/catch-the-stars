<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b1026">
  <title>Catch the Stars</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1026; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="game" aria-label="Catch the Stars game. Move your basket to catch stars and avoid bombs."></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const STORE = 'catch-the-stars-v2';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { return {}; } })();
  const settings = { sound: saved.sound !== false, theme: saved.theme || 0, reducedMotion: saved.reducedMotion === true };
  const themes = [
    { bg: '#0b1026', accent: '#6ec1ff', glow: '#182454' },
    { bg: '#17102b', accent: '#ff8bd1', glow: '#3a1744' },
    { bg: '#071f25', accent: '#6fffd2', glow: '#103d3c' },
    { bg: '#211509', accent: '#ffb35c', glow: '#4b2c14' }
  ];
  let W = 0, H = 0, dpr = 1, state = 'menu', mode = 0;
  const modeNames = ['Classic', 'Timed', 'Endless'];
  let player, items = [], particles = [], starsBg = [], score = 0, lives = 3, frame = 0;
  let combo = 0, comboTimer = 0, level = 1, elapsed = 0, timeLeft = 60;
  let power = '', powerTimer = 0, shield = 0, best = Number(saved.best) || 0;
  let announcement = '', announcementTimer = 0, soundCtx = null;
  const achievements = new Set(saved.achievements || []);
  let moveLeft = false, moveRight = false, lastTime = 0;

  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify({ best, sound: settings.sound, theme: settings.theme, reducedMotion: settings.reducedMotion, achievements: [...achievements] })); } catch {}
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (player) player.x = clamp(player.x, player.w / 2, W - player.w / 2);
    starsBg = Array.from({ length: Math.max(35, Math.floor(W * H / 11000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random() * .8 }));
  }
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  function audio(freq = 600, duration = .07, type = 'sine') {
    if (!settings.sound) return;
    try {
      soundCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (soundCtx.state === 'suspended') soundCtx.resume();
      const osc = soundCtx.createOscillator(), gain = soundCtx.createGain();
      osc.type = type; osc.frequency.value = freq; gain.gain.setValueAtTime(.08, soundCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, soundCtx.currentTime + duration);
      osc.connect(gain); gain.connect(soundCtx.destination); osc.start(); osc.stop(soundCtx.currentTime + duration);
    } catch {}
  }
  function announce(text) { announcement = text; announcementTimer = 2.2; }
  function award(id, text) {
    if (achievements.has(id)) return;
    achievements.add(id); announce('Achievement: ' + text); persist();
  }
  function resetGame() {
    player = { x: W / 2, y: H - 48, w: 92, speed: 440 };
    items = []; particles = []; score = 0; lives = 3; frame = 0; combo = 0; comboTimer = 0;
    level = 1; elapsed = 0; timeLeft = 60; power = ''; powerTimer = 0; shield = 0;
    state = 'playing'; lastTime = performance.now();
  }
  function startGame() { resetGame(); audio(520, .12); }
  function gameOver() {
    if (state !== 'playing') return;
    state = 'over'; best = Math.max(best, score); persist(); audio(170, .3, 'triangle');
  }
  function spawn() {
    const r = Math.random();
    let type = 'star';
    if (r < .09) type = 'gold';
    else if (r < .15) type = 'bomb';
    else if (r < .19) type = 'heart';
    else if (r < .25) type = 'power';
    const radius = type === 'gold' ? 18 : 15;
    items.push({ x: 18 + Math.random() * Math.max(1, W - 36), y: -25, r: radius, type,
      vy: (115 + Math.random() * 100 + level * 10) * (type === 'bomb' ? 1.18 : 1), vx: (Math.random() - .5) * 55,
      phase: Math.random() * 7 });
  }
  function burst(x, y, color, count = 10) {
    if (settings.reducedMotion) return;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, speed = 35 + Math.random() * 150;
      particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: .35 + Math.random() * .4, max: .75, color, r: 2 + Math.random() * 3 });
    }
  }
  function caught(item) {
    if (item.type === 'bomb') {
      if (shield > 0) { shield--; burst(item.x, item.y, '#7cecff', 15); announce('Shield blocked a bomb!'); audio(380, .15); }
      else { lives--; combo = 0; comboTimer = 0; burst(item.x, item.y, '#ff5468', 16); announce('Bomb!'); audio(120, .2, 'sawtooth'); }
      if (lives <= 0) gameOver();
      return;
    }
    if (item.type === 'heart') {
      lives = Math.min(5, lives + 1); score += 2; announce('Extra life +2'); burst(item.x, item.y, '#ff6b8c'); audio(850, .12); return;
    }
    if (item.type === 'power') {
      const choices = ['shield', 'magnet', 'slow', 'double', 'wide'];
      power = choices[Math.floor(Math.random() * choices.length)]; powerTimer = 8;
      if (power === 'shield') shield = Math.max(shield, 1);
      if (power === 'wide') player.w = 142;
      announce(({ shield: 'Shield!', magnet: 'Star magnet!', slow: 'Slow motion!', double: 'Double points!', wide: 'Wide basket!' })[power]);
      burst(item.x, item.y, '#b78cff', 16); audio(900, .18); return;
    }
    combo = comboTimer > 0 ? combo + 1 : 1; comboTimer = 2.4;
    const multiplier = Math.min(5, 1 + Math.floor(combo / 5));
    const points = (item.type === 'gold' ? 5 : 1) * multiplier * (power === 'double' ? 2 : 1);
    score += points; burst(item.x, item.y, item.type === 'gold' ? '#ffd34d' : '#ffe77a', 8);
    audio(item.type === 'gold' ? 950 : 680, .06);
    if (combo === 5) announce('5 catch combo!');
    if (score >= 10) award('first10', 'First ten points');
    if (combo >= 10) award('combo10', 'Combo master');
  }
  function update(dt) {
    if (state !== 'playing') {
      for (const b of starsBg) { b.y += b.z * 12 * dt; if (b.y > H) { b.y = 0; b.x = Math.random() * W; } }
      return;
    }
    elapsed += dt; frame++;
    level = 1 + Math.floor(score / 15);
    if (mode === 1) { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; gameOver(); } }
    const slowFactor = power === 'slow' ? .55 : 1;
    if (moveLeft) player.x -= player.speed * dt;
    if (moveRight) player.x += player.speed * dt;
    player.x = clamp(player.x, player.w / 2, W - player.w / 2);
    if (powerTimer > 0) { powerTimer -= dt; if (powerTimer <= 0) { power = ''; player.w = 92; } }
    if (comboTimer > 0) comboTimer -= dt; else combo = 0;
    if (announcementTimer > 0) announcementTimer -= dt;
    if (frame % Math.max(14, 48 - level * 2) === 0) spawn();
    const by = H - 48;
    const remaining = [];
    for (const item of items) {
      item.phase += dt * 3;
      if (power === 'magnet' && item.type !== 'bomb') {
        const dx = player.x - item.x, dy = by - item.y, dist = Math.hypot(dx, dy);
        if (dist < 190 && dist > 1) { item.vx += dx / dist * 330 * dt; item.vy += dy / dist * 180 * dt; }
      }
      item.y += item.vy * dt * slowFactor; item.x += (item.vx + Math.sin(item.phase) * 12) * dt;
      if (item.x < item.r || item.x > W - item.r) item.vx *= -1;
      const catches = item.y + item.r >= by - 8 && item.y - item.r <= by + 10 && Math.abs(item.x - player.x) < player.w / 2 + item.r * .4;
      if (catches) { caught(item); continue; }
      if (item.y - item.r > H) {
        if (item.type === 'star' || item.type === 'gold') {
          if (shield > 0) { shield--; announce('Shield saved a life!'); }
          else { lives--; combo = 0; audio(240, .08); }
          if (lives <= 0) gameOver();
        }
        continue;
      }
      remaining.push(item);
    }
    items = remaining;
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    if (score >= 30) award('score30', 'Star collector');
    if (elapsed >= 30) award('survivor', 'Survived thirty seconds');
    if (mode === 0 && lives <= 0) gameOver();
  }
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  function text(str, x, y, size, color = '#fff', align = 'center', weight = '600') {
    ctx.font = `${weight} ${size}px system-ui, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
  }
  function draw() {
    const theme = themes[settings.theme];
    ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, W, H);
    for (const b of starsBg) { ctx.globalAlpha = .35 + b.z * .55; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.z * 1.7, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    const compact = W < 500;
    if (state === 'playing') {
      // Parallax space glow and falling objects.
      const gradient = ctx.createRadialGradient(W / 2, H * .38, 5, W / 2, H * .38, Math.max(W, H) * .75);
      gradient.addColorStop(0, theme.glow); gradient.addColorStop(1, 'transparent'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
      for (const item of items) {
        const emoji = item.type === 'gold' ? '🌟' : item.type === 'bomb' ? '💣' : item.type === 'heart' ? '💖' : item.type === 'power' ? '✨' : '⭐';
        text(emoji, item.x, item.y, item.type === 'gold' ? 30 : 27);
      }
      for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
      // Basket glow indicates active power and shield.
      ctx.shadowColor = power ? '#bd8cff' : theme.accent; ctx.shadowBlur = power || shield ? 22 : 8;
      roundRect(player.x - player.w / 2, player.y - 8, player.w, 18, 8, theme.accent);
      ctx.shadowBlur = 0; text('✦', player.x, player.y - 13, 17, '#fff');
      roundRect(12, 12, Math.min(W - 24, 230), 38, 12, 'rgba(255,255,255,.1)');
      text(`Score ${score}   ♥ ${lives}`, 24, 31, compact ? 15 : 17, '#fff', 'left');
      text(`Best ${best}`, W - 15, 29, 14, '#d5ddff', 'right');
      text(`LV ${level}`, 20, 67, 13, '#ffe27a', 'left');
      if (mode === 1) text(`⏱ ${Math.ceil(timeLeft)}`, W - 18, 57, 15, timeLeft < 10 ? '#ff687e' : '#fff', 'right');
      if (combo >= 2) text(`${combo} combo ×${Math.min(5, 1 + Math.floor(combo / 5))}`, W / 2, 34, 17, '#ffe27a');
      if (power) text(`${power.toUpperCase()} ${Math.ceil(powerTimer)}s${shield ? '  🛡' : ''}`, W / 2, 61, 13, '#d7b8ff');
      else if (shield) text('SHIELD 🛡', W / 2, 61, 13, '#9deaff');
      roundRect(W - 65, H - 88, 52, 40, 12, 'rgba(255,255,255,.13)'); text('Ⅱ', W - 39, H - 68, 20);
      if (announcementTimer > 0) { roundRect(W / 2 - 120, H * .23 - 18, 240, 36, 16, 'rgba(12,16,38,.85)'); text(announcement, W / 2, H * .23, 15, '#ffe27a'); }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,.24)'; ctx.fillRect(0, 0, W, H);
      text('✦', W / 2, H * .2, 50, '#ffd34d');
      text('CATCH THE STARS', W / 2, H * .29, compact ? 27 : 36, '#fff', 'center', '800');
      if (state === 'menu') {
        text('Catch stars • dodge bombs • collect power-ups', W / 2, H * .37, compact ? 13 : 16, '#cbd3f4');
        roundRect(W / 2 - 128, H * .44, 256, 52, 18, theme.accent); text('PLAY', W / 2, H * .44 + 26, 20, '#071126', 'center', '800');
        roundRect(W / 2 - 128, H * .44 + 64, 256, 44, 15, 'rgba(255,255,255,.12)'); text(`MODE: ${modeNames[mode]}  ◀ ▶`, W / 2, H * .44 + 86, 15);
        text(`Best score: ${best}`, W / 2, H * .44 + 134, 15, '#ffe27a');
        text(`Sound: ${settings.sound ? 'ON' : 'OFF'}   •   Theme: ${settings.theme + 1}/4`, W / 2, H * .44 + 164, 14, '#cbd3f4');
        text('Tap the settings line to change sound / theme', W / 2, H * .44 + 190, 12, '#8995c0');
        text('Move: mouse / touch / ← →    Pause: P or Esc', W / 2, H * .44 + 220, 12, '#8995c0');
        if (achievements.size) text(`Achievements unlocked: ${achievements.size}/4`, W / 2, H * .44 + 250, 13, '#b9a2ff');
      } else if (state === 'paused') {
        text('PAUSED', W / 2, H * .43, 30);
        roundRect(W / 2 - 115, H * .5, 230, 50, 16, theme.accent); text('RESUME', W / 2, H * .5 + 25, 18, '#071126');
        text('Press P, Esc, or tap to resume', W / 2, H * .5 + 78, 14, '#cbd3f4');
      } else {
        text('GAME OVER', W / 2, H * .39, 31, '#ff8291', 'center', '800');
        text(`Score ${score}  •  Best ${best}`, W / 2, H * .45, 18, '#ffe27a');
        roundRect(W / 2 - 115, H * .51, 230, 50, 16, theme.accent); text('PLAY AGAIN', W / 2, H * .51 + 25, 18, '#071126');
        text('Tap or press Enter to return', W / 2, H * .51 + 80, 14, '#cbd3f4');
      }
    }
  }
  function loop(now) {
    const dt = Math.min(.035, (now - (lastTime || now)) / 1000); lastTime = now;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  function setPointer(clientX) { if (player && state === 'playing') player.x = clamp(clientX, player.w / 2, W - player.w / 2); }
  canvas.addEventListener('pointermove', e => setPointer(e.clientX));
  canvas.addEventListener('pointerdown', e => {
    if (state === 'menu') {
      const y = e.clientY;
      if (y > H * .42 && y < H * .44 + 58) startGame();
      else if (y > H * .44 + 62 && y < H * .44 + 112) { mode = (mode + 1) % modeNames.length; audio(500); }
      else if (y > H * .44 + 150 && y < H * .44 + 205) { settings.sound = !settings.sound; settings.theme = (settings.theme + 1) % themes.length; persist(); audio(650); }
    } else if (state === 'playing') {
      if (e.clientY > H - 100 && e.clientX > W - 85) state = 'paused'; else setPointer(e.clientX);
    } else if (state === 'paused') state = 'playing';
    else if (state === 'over') startGame();
  });
  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveLeft = true;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveRight = true;
    if (e.key === 'Escape' || e.key.toLowerCase() === 'p') { if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing'; }
    if (state === 'menu' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) mode = (mode + 1) % modeNames.length;
    if ((state === 'menu' && (e.key === 'Enter' || e.key === ' ')) || (state === 'over' && (e.key === 'Enter' || e.key === ' '))) startGame();
  });
  window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') moveLeft = false; if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') moveRight = false; });
  window.addEventListener('blur', () => { moveLeft = moveRight = false; if (state === 'playing') state = 'paused'; });
  window.addEventListener('resize', resize);
  resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
